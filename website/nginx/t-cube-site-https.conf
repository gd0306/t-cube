# Prepared from the main gd306.cn SSL settings; activate only with a matching certificate.
server {
    listen 80;
    listen [::]:80;
    server_name tcube.gd306.cn;
    return 301 https://tcube.gd306.cn$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name tcube.gd306.cn;

    ssl_certificate "/opt/ssl/tcube.gd306.cn_nginx/tcube.gd306.cn_bundle.crt";
    ssl_certificate_key "/opt/ssl/tcube.gd306.cn_nginx/tcube.gd306.cn.key";
    ssl_session_cache shared:TCubeSSL:1m;
    ssl_session_timeout 10m;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    root /var/www/html/t-cube;
    index index.html;
    charset utf-8;

    include /etc/nginx/t-cube-legacy-locations.conf;

    location = / {
        add_header Cache-Control "no-cache";
        try_files /index.html =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location = /release.json {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
