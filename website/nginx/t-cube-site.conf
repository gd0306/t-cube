# T-Cube's dedicated HTTP origin. HTTPS is intentionally not configured yet.
server {
    listen 80;
    listen [::]:80;
    server_name tcube.gd306.cn;

    root /var/www/html/t-cube;
    index index.html;
    charset utf-8;

    include /etc/nginx/t-cube-legacy-locations.conf;

    location = / {
        add_header Cache-Control "no-cache";
        try_files /index.html =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location = /release.json {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
