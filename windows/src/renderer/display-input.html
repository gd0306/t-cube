<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self';"><link rel="stylesheet" href="display-input.css"><title>显示器输入源</title></head>
<body><main><header><div><h1>显示器输入源</h1><p>将选定的显示器切换到另一台设备。</p></div><button id="close" aria-label="关闭">关闭</button></header>
<div class="toolbar"><label for="display">显示器</label><button id="refresh">刷新</button></div><select id="display" disabled><option>正在读取显示器…</option></select>
<p id="current" class="secondary" aria-live="polite">正在读取当前输入源…</p>
<section aria-labelledby="switch-title"><h2 id="switch-title">输入源</h2><fieldset id="source" class="source-switch" role="radiogroup" aria-label="输入源" data-selected="unknown" disabled><span class="source-selection" aria-hidden="true"></span><label><input type="radio" name="input-source" value="typeC"><span>Type-C</span></label><label><input type="radio" name="input-source" value="hdmi"><span>HDMI</span></label></fieldset><p id="status" role="status">请选择已设置的显示器。</p></section>
<details id="setup"><summary>设置输入源代码</summary><p id="code">当前代码未知。</p><p>请分别在每个输入源激活时读取代码。另一端的代码可能需要在对应主机的 T-Cube 中读取。保存代码不会切换输入源。</p><div class="fields"><label>Type-C 代码 <input id="typec" type="number" min="0" max="65535" step="1" inputmode="numeric"></label><label>HDMI 代码 <input id="hdmi" type="number" min="0" max="65535" step="1" inputmode="numeric"></label></div><div class="actions"><button id="preset">使用 27C1U-D 预设（7 / 5）</button><button id="save">保存代码</button></div></details>
<footer>切回时，请在当前显示画面的主机上操作 T-Cube，或使用显示器实体菜单。</footer></main><script type="module" src="display-input.js"></script></body></html>
